name: Daily trends refresh

on:
  schedule:
    # 05:00 UTC ≈ 07:00 Europe/Paris (été) / 06:00 (hiver)
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-trends:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh trends.json
        run: python3 scripts/update_daily_trends.py

      - name: Commit and push if changed
        run: |
          git config user.name "ufrais-daily-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add UFrais/UFrais/Data/trends.json
          if git diff --staged --quiet; then
            echo "No trends.json change"
            exit 0
          fi
          git commit -m "chore(trends): actualisation quotidienne $(date -u +%Y-%m-%d)"
          git push
